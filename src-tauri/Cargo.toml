[package]
name = "terax"
default-run = "terax"
version = "0.8.2"
description = "Terax — an open-source AI-native terminal emulator"
authors = ["crynta"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["desktop"]
headless = []
desktop = [
    "dep:webview2-com",
    "dep:windows",
    "dep:tauri-build",
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-os",
    "dep:tauri-plugin-store",
    "dep:tauri-plugin-process",
    "dep:notify-rust",
    "dep:tauri-winrt-notification",
    "dep:mac-usernotifications",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-clipboard-manager",
    "dep:arboard",
    "dep:tauri-plugin-global-shortcut",
    "dep:xcap",
    "dep:image",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-window-state",
    "dep:zbus",
    # 当前只有桌面宿主启用 PTY、配置监听、文件模糊搜索与 SSH 连接管理。
    "dep:portable-pty",
    "dep:notify",
    "dep:nucleo-matcher",
    "dep:russh",
    "dep:russh-sftp",
    "dep:tokio-socks",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:rustls-platform-verifier",
]

[[bin]]
name = "terax"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "terax-host"
path = "src/bin/terax-host.rs"
required-features = ["headless"]

[[test]]
name = "terminal_host"
required-features = ["headless"]

[[test]]
name = "git_operations"
required-features = ["desktop"]

[[test]]
name = "fs_search"
required-features = ["desktop"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { optional = true, version = "2", features = [] }

[dependencies]
arboard = { version = "3.6.1", optional = true, default-features = false, features = ["wayland-data-control"] }
tauri = { optional = true, version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = { version = "0.9", optional = true }
dirs = "6"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
ipnet = "2"
nucleo-matcher = { version = "0.3", optional = true }
shared_child = "1"
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-os = { version = "2", optional = true }
tauri-plugin-store = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
xcap = { version = "0.9.8", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
	"socks",
] }
bytes = "1"
base64 = "0.22"
aes = "0.9"
md5 = "0.8"
percent-encoding = "2"
futures-util = "0.3"
filetime = "0.2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"net",
	"io-util",
	"signal",
	"process",
	"time",
	"fs",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
trash = "5.2.6"
notify = { version = "8.2.0", optional = true }
which = "8.0.4"
russh = { version = "0.61.2", optional = true, default-features = false, features = [
	"ring",
	"rsa",
	"flate2",
	"async-trait",
] }
russh-sftp = { version = "2.3.0", optional = true }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
fs2 = "0.4"
zeroize = "1"
tokio-socks = { version = "0.5", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls-platform-verifier = { version = "0.6", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
system-configuration = "0.7"
mac-usernotifications = { version = "0.3.1", optional = true }
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAppearance", "NSColor", "NSGraphics", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }

# Linux 桌面还使用 D-Bus；图片剪贴板由三端共享的原生插件提供。
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18", optional = true }
zbus = { version = "5.19", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = { version = "0.38.2", optional = true }
windows = { version = "0.61.3", optional = true }
tauri-winrt-notification = { version = "0.7.3", optional = true }
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_Security",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_ProcessStatus",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_Storage_FileSystem",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(target_os = "windows")'.dev-dependencies]
junction = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

[profile.release]
incremental = true
codegen-units = 16
lto = "off"
opt-level = "s"
panic = "abort"
strip = true

# rust-lang/rust#110536: stripping proc-macro dylibs breaks the dlopen rustc does
# at compile time on macOS, reported as a bogus E0463. Never shipped, so nothing to strip.
[profile.release.build-override]
strip = false
