[package]
name = "terax"
default-run = "terax"
version = "1.0.0"
description = "Terax - an open-source AI-native terminal emulator"
authors = ["crynta"]
repository = "https://github.com/alphagauss/terax"
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "terax"
path = "src/main.rs"

[lib]
name = "terax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
terax-git = { path = "../crates/terax-git" }
terax-http = { path = "../crates/terax-http" }
terax-lsp = { path = "../crates/terax-lsp" }
terax-pty = { path = "../crates/terax-pty" }
terax-transfers = { path = "../crates/terax-transfers" }
terax-core = { path = "../crates/terax-core", features = ["workspace-runtime"] }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = { version = "2" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
dirs = { workspace = true }
log = { workspace = true }
shared_child = { workspace = true }
tauri-plugin-log = { version = "2" }
tauri-plugin-os = { version = "2" }
tauri-plugin-store = { version = "2" }
tauri-plugin-process = { version = "2" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-clipboard-manager = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }
xcap = { version = "0.9.8" }
image = { version = "0.25", default-features = false, features = ["png"] }
bytes = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "net",
    "io-util",
    "signal",
    "process",
    "time",
    "fs",
] }
tokio-util = { workspace = true, features = ["rt"] }
tempfile = { workspace = true }
notify = { workspace = true }
which = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = { version = "0.3.1" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSAppearance",
    "NSColor",
    "NSGraphics",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18" }
zbus = { version = "5.19" }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = { version = "0.38.2" }
windows = { version = "0.61.3" }
tauri-winrt-notification = { version = "0.7.3" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = { version = "2" }
tauri-plugin-window-state = { version = "2" }
