name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit (advisory)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: React Compiler healthcheck (advisory)
        run: pnpm exec react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        run: pnpm build

      - name: Size budget
        run: pnpm size

      - name: Dead code (advisory)
        run: pnpm knip
        continue-on-error: true

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fish \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: taiki-e/install-action@v2.85.12
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: Check standalone terminal host
        run: cargo check -p terax-host --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        run: cargo nextest run --workspace --locked

      - name: fish shell integration
        run: fish --no-config crates/terax-core/src/modules/shell/scripts/init.test.fish

  rust-platforms:
    name: rust-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: taiki-e/install-action@v2.85.12
        with:
          tool: cargo-nextest

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo nextest
        run: cargo nextest run --workspace --locked --retries 2

  coverage:
    runs-on: ubuntu-22.04
    needs: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: coverage

      - uses: taiki-e/install-action@v2.85.12
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: lcov.info
          if-no-files-found: error
