[workspace]
members = ["crates/terax-core", "crates/terax-host", "src-tauri"]
default-members = ["src-tauri"]
resolver = "2"

[workspace.dependencies]
notify = "8.2.0"
serde = "1"
serde_json = "1"
dirs = "6"
log = "0.4"
shared_child = "1"
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
tempfile = "3"
which = "8.0.4"
uuid = "1"
proptest = "1"
libc = "0.2"
windows-sys = "0.61"
winreg = "0.55"
junction = "2"
keyring = { version = "3.6", default-features = false }

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

[profile.release]
incremental = true
codegen-units = 16
lto = "off"
opt-level = "s"
panic = "abort"
strip = true

# 构建期过程宏不随程序交付，保留符号以支持 macOS 编译期加载。
[profile.release.build-override]
strip = false
