[package]
name = "terax-git"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
sha2 = { workspace = true }
shared_child = { workspace = true }
terax-core = { path = "../terax-core", features = ["workspace-runtime"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
