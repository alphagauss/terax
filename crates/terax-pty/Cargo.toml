[package]
name = "terax-pty"
version = "0.8.2"
edition = "2021"
publish = false

[dependencies]
terax-core = { path = "../terax-core", features = ["workspace-runtime"] }
dirs = { workspace = true }
log = { workspace = true }
portable-pty = "0.9"
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["process", "time"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
