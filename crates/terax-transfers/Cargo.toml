[package]
name = "terax-transfers"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
terax-core = { path = "../terax-core", features = ["workspace-runtime"] }
filetime = { workspace = true }
flate2 = "1"
futures-util = { workspace = true }
ignore = { workspace = true }
log = { workspace = true }
russh-sftp = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
tar = "0.4"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
